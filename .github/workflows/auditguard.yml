name: AuditGuard Demo Report

on:
  push:
    branches: [main]
    paths:
      - 'sample/**'
      - '.github/workflows/auditguard.yml'
  workflow_dispatch:

concurrency:
  group: auditguard-report-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout AuditGuard (la herramienta)
        uses: actions/checkout@v4
        with:
          repository: rodricastanio/AuditGuard
          ref: main
          path: AuditGuard

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install AuditGuard dependencies
        working-directory: AuditGuard
        run: npm ci --production

      - name: Install Semgrep
        run: pip install semgrep==1.170.1
        env:
          SEMGREP_SEND_METRICS: 'off'

      # Ejecuta el dist real de AuditGuard (el mismo código del paso "scan" de
      # action.yml). Con GITHUB_STEP_SUMMARY apuntando a report.md, la acción
      # escribe el reporte Markdown como archivo dentro del repo.
      - name: Run AuditGuard (motores reales) y emitir report.md
        id: scan
        run: node AuditGuard/dist/index.js
        env:
          AUDITGUARD_SCAN_PATH: './sample'
          AUDITGUARD_FAIL_ON_LEVEL: 'never'
          AUDITGUARD_SEMGREP_RULESETS: 'p/default,p/security-audit,p/owasp-top-ten'
          AUDITGUARD_ESLINT_CONFIG: ''
          AUDITGUARD_AUTO_PR: 'false'
          AUDITGUARD_DRY_RUN: 'true'
          AUDITGUARD_REPORT_LANG: 'en'
          GITHUB_STEP_SUMMARY: '${{ github.workspace }}/report.md'
          GITHUB_TOKEN: ${{ github.token }}

      - name: Commit report back
        run: |
          echo "report.md bytes: $(wc -c < report.md)"
          if [ -n "$(git status --porcelain report.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add report.md
            git commit -m "chore: regenerate AuditGuard report"
            git push
            echo "Report committed."
          else
            echo "report.md unchanged."
          fi
