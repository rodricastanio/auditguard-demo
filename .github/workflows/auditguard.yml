name: AuditGuard Demo Report

on:
  push:
    branches: [main]
    paths:
      - 'sample/**'
      - '.github/workflows/auditguard.yml'
  workflow_dispatch:

concurrency:
  group: auditguard-report-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run AuditGuard
        id: audit
        uses: rodricastanio/AuditGuard@main
        with:
          scan-path: './sample'
          fail-on-level: 'never'
          semgrep-rulesets: 'p/default,p/security-audit,p/owasp-top-ten'
          report-lang: 'en'
          auto-pr: 'false'
          dry-run: 'true'

      - name: Save report to file
        run: |
          cp "$GITHUB_STEP_SUMMARY" report.md
          echo "report.md bytes: $(wc -c < report.md)"

      - name: Commit report back
        run: |
          if [ -n "$(git status --porcelain report.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add report.md
            git commit -m "chore: regenerate AuditGuard report"
            git push
            echo "Report committed."
          else
            echo "report.md unchanged."
          fi
