name: AuditGuard Demo Report

on:
  push:
    branches: [main]
    paths:
      - 'sample/**'
      - '.github/workflows/auditguard.yml'
  workflow_dispatch:

concurrency:
  group: auditguard-report-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout AuditGuard (la herramienta)
        uses: actions/checkout@v4
        with:
          repository: rodricastanio/AuditGuard
          ref: main
          path: AuditGuard

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install AuditGuard dependencies
        working-directory: AuditGuard
        run: npm ci --production

      - name: Install Semgrep
        run: pip install semgrep==1.170.1
        env:
          SEMGREP_SEND_METRICS: 'off'

      # Ejecuta los motores reales de AuditGuard (dist/…-engine.js) sobre el
      # sample y materializa el reporte como report.md. El GITHUB_STEP_SUMMARY
      # no puede redirigirse a un archivo (el runner lo inyecta por paso).
      - name: Run AuditGuard engines (dist real) y emitir report.md
        id: scan
        run: node scripts/run-on-actions.mjs
        env:
          AUDITGUARD_SCAN_PATH: './sample'
          GITHUB_TOKEN: ${{ github.token }}

      - name: Commit report back
        run: |
          echo "report.md bytes: $(wc -c < report.md)"
          if [ -n "$(git status --porcelain report.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add report.md
            git commit -m "chore: regenerate AuditGuard report"
            git push
            echo "Report committed."
          else
            echo "report.md unchanged."
          fi
